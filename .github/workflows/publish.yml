name: Publish to PyPI
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already declared on main (for example 0.1.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pypi-publication
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']
          assert project['version'] == os.environ['RELEASE_VERSION'], 'Version does not match main'
          PY
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python -m pip install dist/*.whl pytest
      - run: python -m pip check
      - run: python -I scripts/test_installed.py --sdist dist/*.tar.gz --module pymuscat --distribution py-muscat-omicverse
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
